; /etc/supervisor/conf.d/fikrlash.conf
; sudo supervisorctl reread && sudo supervisorctl update

; Asosiy navbatlar: high (SMS/OTP) → default (bildirishnomalar)
[program:fikrlash-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fikrlash/current/artisan queue:work redis --queue=high,default --sleep=1 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/fikrlash/shared/storage/logs/worker.log
stopwaitsecs=3600

; AI tahlil — alohida, sekin navbat (asosiy navbatni bloklamasin)
[program:fikrlash-ai]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fikrlash/current/artisan queue:work redis --queue=ai --sleep=3 --timeout=120 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/fikrlash/shared/storage/logs/ai-worker.log
stopwaitsecs=180
