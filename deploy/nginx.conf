# /etc/nginx/sites-available/fikrlash.uz
# SSL: sudo certbot --nginx -d fikrlash.uz -d www.fikrlash.uz

server {
    listen 80;
    listen [::]:80;
    server_name fikrlash.uz www.fikrlash.uz;
    return 301 https://fikrlash.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fikrlash.uz;
    root /var/www/fikrlash/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/fikrlash.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fikrlash.uz/privkey.pem;

    charset utf-8;
    client_max_body_size 80M;         # chatda video (50 MB) va bir nechta rasm
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite build fayllari — nomida hash bor, uzoq keshlash xavfsiz
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /storage/ {
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        # Yuklangan fayllar ichida PHP hech qachon bajarilmaydi
        location ~ \.php$ { return 403; }
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Boshqa barcha .php va maxfiy fayllarga kirish taqiqlanadi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
