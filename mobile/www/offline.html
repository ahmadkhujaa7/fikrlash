<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internet yo‘q — Fikrlash</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #14151b; --muted: #6b6e7b; --line: #e6e4de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14151b; --ink: #f2f1ee; --muted: #9a9caa; --line: #2a2c36; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 32px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 28px; display: grid; place-items: center;
          background: linear-gradient(160deg, #6c7ff2, #2836ab); color: #fff; font: 600 44px/1 Georgia, serif; position: relative; }
  .logo::after { content: ''; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ffc861; right: 17px; bottom: 19px; }
  h1 { font: 600 26px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 10px; }
  p { margin: 0 auto 28px; max-width: 300px; color: var(--muted); }
  button { appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; font: 600 16px/1 system-ui, sans-serif; color: #fff;
           background: linear-gradient(160deg, #5469f0, #2536ad); box-shadow: 0 10px 24px -12px rgb(48 73 209 / .8); }
  button:active { transform: scale(.97); }
  .hint { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">f</div>
    <h1>Internet aloqasi yo‘q</h1>
    <p>Fikrlash’ni ochib bo‘lmadi. Wi-Fi yoki mobil internet yoqilganini tekshiring.</p>
    <button type="button" id="retry">Qayta urinish</button>
    <div class="hint" id="hint">Internet paydo bo‘lishi bilan o‘zi ochiladi.</div>
  </main>
  <script>
    var home = 'https://fikrlash.uz/';
    function retry() { document.getElementById('hint').textContent = 'Ulanmoqda…'; location.replace(home); }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
